name: Deploy mobile game to GitHub Pages

on:
  push:
    branches:
      - one-piece-development
    paths:
      - index.html
      - ai/*.js
      - about/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check whether GitHub Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled yet. Set Settings > Pages > Source to GitHub Actions to publish the game."
          fi

      - name: Configure GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare static game files
        if: steps.pages_check.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R ai _site/ai
          cp -R about _site/about
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
