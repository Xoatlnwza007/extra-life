name: AI module tests

on:
  push:
    branches:
      - one-piece-development
    paths:
      - 'ai/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/test-ai.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI unit tests
        run: node --test tests/ai.test.js
