name: AI module tests

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/test-ai.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ai/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/test-ai.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI unit tests
        run: node --test tests/ai.test.js

  browser-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run phone and tablet browser smoke tests
        run: node tests/browser-smoke.js
